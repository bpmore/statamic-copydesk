# The addon's suite, on every push and pull request, booting Statamic through
# Testbench. The engine, bpmore/readability-core, is its own repository with
# its own CI; it arrives here from Packagist like any other dependency. Shaped
# like the workflow in Accessibility Gate; no ext-intl branch to exercise yet.
#
# The second job is the oldest PHP the manifest allows, with the oldest version
# of every dependency it allows. A floor in composer.json is a promise about a
# machine nobody on this project runs, and the only thing that makes it true is
# a runner that is that machine. When this job goes red on a commit that changed
# nothing, a dependency raised its own floor, and that is the moment to raise
# ours rather than the moment a customer finds out.
#

name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing here writes to the repository, comments on a pull request,
# or touches a package registry, so it should not be able to.
permissions:
  contents: read

# A second push to the same branch cancels the first. The suite takes seconds
# and the answer for an overwritten commit is worth nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  addon:
    name: statamic-copydesk, PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            dependencies: highest
          - php: '8.2'
            dependencies: lowest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check the manifest is well formed
        run: composer validate --strict

      # Site Weather is a dev dependency by path, ../statamic-site-weather,
      # which exists beside this repo on a developer's machine and nowhere
      # else; Composer refuses to load a path repository whose directory is
      # missing. So the runner drops it before installing, and the Site
      # Weather tests skip themselves when the contract is not there. The
      # real contract is what is tested wherever it is installed.
      - name: Drop the Site Weather path dependency, which is not on this runner
        run: |
          composer config --unset repositories.bpmore-site-weather
          composer remove --dev bpmore/statamic-site-weather --no-update --no-interaction

      # The engine comes from Packagist, at whatever version the manifest
      # allows, the same way it reaches a site.
      - name: Install dependencies
        if: matrix.dependencies == 'highest'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install the oldest dependencies the manifest allows
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

      # Statamic must be 6; anything else is a resolution bug, per CLAUDE.md.
      - name: Confirm Statamic 6 resolved
        run: |
          composer show statamic/cms | grep -E '^versions : \* v6\.'

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Run the suite
        run: vendor/bin/pest

  assets:
    name: Control panel assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The Vite plugin comes from vendor/statamic/cms, so Composer runs first.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Drop the Site Weather path dependency, which is not on this runner
        run: |
          composer config --unset repositories.bpmore-site-weather
          composer remove --dev bpmore/statamic-site-weather --no-update --no-interaction

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The editor's position and spacing arithmetic, in Node's own runner.
      - run: npm test

      - run: npm run build

      # The build is committed, because an addon ships its assets rather than
      # asking every site to run a build. A change to resources/js that was
      # not rebuilt and committed would ship the old bundle.
      - name: Committed build is current
        run: git diff --exit-code -- resources/dist
